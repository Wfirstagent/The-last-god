name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 liblzma-dev libsqlite3-dev build-essential libssl-dev libffi-dev gettext libltdl-dev cmake g++

    - name: Install Buildozer and python-for-android
      run: |
        python -m pip install --upgrade "pip<24.1" "setuptools<70" wheel
        python -m pip install --upgrade "Cython==0.29.36" "sh>=1.10,<2.0" "buildozer<1.5.0,>=1.4.0" "python-for-android==2024.01.21"

    - name: Clear stale Buildozer cache
      run: |
        rm -rf ~/.buildozer .buildozer

    - name: Build APK with Buildozer
      env:
        ANDROID_HOME: ""
        ANDROID_SDK_ROOT: ""
        ANDROID_NDK_HOME: ""
        ANDROIDSDK: ""
        ANDROIDNDK: ""
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
        if-no-files-found: error
